# Serving a Next static export.
#
# The export is FLAT: connect.html, rules.html, review.html, data.html, index.html. Not a
# directory per route. So /connect only resolves through the $uri.html fallback, and
# without it every page except the root 404s -- which reads as a broken build and is only
# a missing try_files rule.

server {
    listen 3300;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable; the HTML must not be, or a rebuilt dashboard keeps
    # serving the previous run's markup out of the browser cache.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
}
