# Commons, whole, from a clean clone:
#
#     docker compose up
#
# Dashboard on http://localhost:3300, gateway on http://localhost:8787.
#
# EVERY PORT IS PUBLISHED TO 127.0.0.1, not 0.0.0.0. Containers bind 0.0.0.0 internally
# because a container's loopback reaches only itself, and the default `8787:8787` form
# would then expose a service holding payment amounts and customer identifiers to the
# whole local network. Binding the host side to loopback keeps the exposure identical to
# running it with python directly, which is the promise the README makes.
#
# Razorpay and Resend are NOT services here. They are remote MCP servers reached over
# HTTPS and configured at runtime from the Connect page. The only vendor that runs
# locally is the reference messaging server, which exists to prove Commons resolves one
# customer across two independently built vendors.

services:
  gateway:
    build: .
    image: commons/gateway:local
    container_name: commons-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      COMMONS_HOST: 0.0.0.0
      COMMONS_PORT: "8787"
      COMMONS_DB: /data/commons.db
      COMMONS_AGENTS: /data/agents.yaml
      COMMONS_VENDORS: /data/vendors.yaml
      # Starts in OBSERVE, which blocks nothing. Switch from the dashboard header once
      # you have watched it for a few days, or set COMMONS_MODE=ENFORCE in .env.
      COMMONS_MODE: ${COMMONS_MODE:-OBSERVE}
      # Compose reads .env from this directory on its own, so these resolve without an
      # env_file entry, and default to empty when there is no .env at all. Passing them
      # as environment rather than baking them into the image is deliberate: a key in a
      # layer is recoverable by anyone who gets the image.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      # commons.db, agents.yaml and vendors.yaml. Named rather than a bind mount so a
      # Windows clone works without path translation; `docker compose down -v` is the
      # documented way to start clean.
      - commons-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen('http://127.0.0.1:8787/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      # The gateway calls tools/list against every configured vendor before it serves, so
      # a cold start with remote vendors is seconds, not milliseconds.
      start_period: 40s

  # The second vendor. Commons connects to it exactly as it connects to Razorpay, with no
  # knowledge that it is ours. Add it on Connect as http://messaging:8788/mcp -- the
  # service name, not 127.0.0.1, which from inside the gateway container is the gateway.
  messaging:
    build: .
    image: commons/gateway:local
    container_name: commons-messaging
    restart: unless-stopped
    command: ["python", "mcp_servers/messaging/run.py"]
    environment:
      MESSAGING_HOST: 0.0.0.0
      MESSAGING_PORT: "8788"
    ports:
      - "127.0.0.1:8788:8788"

  dashboard:
    build:
      context: ./dashboard
      args:
        # Baked in at build time and used by the BROWSER, which runs on the host. So this
        # is the host's view of the gateway, not the compose network's.
        NEXT_PUBLIC_COMMONS_URL: ${NEXT_PUBLIC_COMMONS_URL:-http://127.0.0.1:8787}
    image: commons/dashboard:local
    container_name: commons-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:3300:3300"
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3300/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  commons-data:
