# Tool semantics for Razorpay's MCP server (remote: 42 tools).
#
# Declared from the PUBLIC tool schemas — verified against tools/list on 2026-08-25,
# not guessed. Note the input schemas are FLAT (customer_contact, notify_sms) while the
# API *responses* are nested (customer.contact); the paths below reflect that difference.
#
# Commons never reads a vendor's source. Everything needed to govern a tool is in the
# schema the vendor already publishes, which is what makes this work for third-party
# agents in a marketplace.

upstream: razorpay

tools:
  # Cart Recovery / Subscription Recovery: a discounted payment link.
  # The discount is what consumes the shared margin budget.
  create_payment_link:
    action_class: discount_grant
    entity:
      from: args
      path: customer_contact
      as: phone
    # This one call carries the customer's email too. Razorpay is asserting that the
    # phone and the email are the same customer, so Commons records the link rather
    # than treating a later email-only contact as a different person.
    also_identifies:
      - {from: args, path: customer_email, as: email}
    magnitude:
      from: args
      path: notes.discount_pct
      unit: percent
    # What is being discounted. A cart and a subscription are both "the thing this offer
    # attaches to", under different names — first hit wins. This is what stops three
    # dunning retries on ONE subscription counting as three separate giveaways.
    resource:
      from: args
      path: [notes.order_id, notes.subscription_id]

  # Razorpay's OWN outbound contact tool. Discovered during the Day 1 spike.
  # This is why the frequency rule is breached across two vendors' surfaces rather
  # than only via the messaging server we wrote ourselves.
  payment_link_notify:
    action_class: promotional_message
    entity:
      from: upstream_lookup
      tool: fetch_payment_link
      args: {payment_link_id: payment_link_id}
      path: customer.contact
      as: phone

  # RTO Shield restricting an order to prepaid-only. Directly contradicts a Cart
  # Recovery incentive on the same customer — the Contradiction rule (plan §4).
  update_order:
    action_class: fulfilment_restriction
    # Resolved through the merchant's DECLARED order -> customer mapping rather than by
    # asking Razorpay. Asking the vendor was tried first and resolves to nobody whenever
    # the order lives outside that vendor's records — which is the normal case for an
    # order placed on a storefront and only later paid for. A rule about the customer
    # behind an order cannot fire if the order names no customer.
    entity:
      from: args
      path: order_id
      as: order_id
    resource:
      from: args
      path: order_id

  # Reads are never GOVERNED — they consume nothing shared, so no rule applies to them.
  # But where a read names a customer, it is still ATTRIBUTED to them, because an agent
  # investigating someone's order is an agent working that customer. A layer whose job is
  # awareness of what every agent is doing should show that on the timeline; leaving reads
  # unattributed made whole agents invisible even while they were busy.
  fetch_order:
    action_class: read
    entity: {from: args, path: order_id, as: order_id}

  fetch_payment: {action_class: read}
  fetch_all_payments: {action_class: read}
  fetch_all_orders: {action_class: read}
  fetch_payment_link: {action_class: read}
  fetch_refund: {action_class: read}
  fetch_specific_refund_for_payment: {action_class: read}
