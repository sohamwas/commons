# Tool semantics for the messaging MCP server (ours — Day 4).
#
# A second, independently-built vendor is REQUIRED (handoff §8.3): Razorpay's MCP has
# no general messaging tools, and entity resolution only becomes interesting across
# servers. Inside one vendor everything already carries a customer_id; the hard part is
# recognising that a phone number here and a customer id there are one human.

# A shipping update is not a marketing touch, and frequency caps should apply only to
# the latter. But note WHERE that distinction is allowed to come from.
#
# The `kind` argument is supplied by the CALLING AGENT. Classification that decides
# whether policy applies must never be caller-declared: an agent can exempt itself from
# a frequency cap simply by labelling its own marketing "transactional" — which is
# exactly what happened on the first full run, where every cart-recovery message arrived
# tagged transactional and no frequency rule fired.
#
# Nothing was gaming the system; the agents have no idea Commons exists. They just think
# a cart nudge is transactional. That is the point: self-declared classification is
# unreliable even when everyone is acting in good faith.
#
# So the exemption comes from `template`, which names an entry in the MERCHANT's approved
# template list, not from a free-text field the agent fills in.

upstream: messaging

transactional_templates: &transactional_templates
  - shipping_update
  - delivery_confirmation
  - payment_receipt
  - otp
  # Correspondence ABOUT a dispute is not marketing, and must not be caught by the rule
  # that stops marketing at a customer who is in dispute. Without this the merchant's own
  # dispute handler would be silenced at precisely the moment it needs to write.
  - dispute_response
  # Telling a customer their order now requires prepayment is an order-status alert, not
  # a marketing touch. Without this, RTO Shield's own notification counts against the
  # marketing frequency cap and reads on the timeline as "RTO Shield sent a promotion",
  # which is simply false.
  - order_update

tools:
  send_whatsapp:
    action_class: promotional_message
    action_class_when:
      - if: {path: template, in: *transactional_templates}
        then: transactional_message
    entity:
      from: args
      path: to
      as: phone

  send_email:
    action_class: promotional_message
    action_class_when:
      - if: {path: template, in: *transactional_templates}
        then: transactional_message
    entity:
      from: args
      path: to
      as: email
