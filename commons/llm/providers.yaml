# Which model does which job.
#
# Measured against the real accounts on 2026-08-24 (scripts/probe_providers.py), NOT
# taken from the handoff, which was stale: Cerebras' free tier is gone (402 on every
# model) and Groq has retired Llama 3.3 70B.
#
# Gemini quotas are per-model per-project, so four flash models are four independent
# buckets. That is why Google carries most of the fleet — not generous limits, but
# several separate ones.

providers:
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GOOGLE_API_KEY
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

roles:
  # Highest-volume agent, on the largest request budget: 1000 requests/day.
  #
  # It bounced between providers during Day 8 debugging, which taught the real lesson:
  # the binding constraint is REQUESTS PER DAY, not tokens. Each call here is only ~400
  # tokens, because least privilege exposes this agent 3 tools rather than Razorpay's 42
  # — so the 8000 TPM ceiling allows ~20 calls a minute and never bites. Cart Recovery's
  # ~90 calls per run is 9% of Groq's daily budget; the same load exhausts a Gemini
  # bucket outright. Volume belongs where the REQUEST headroom is.
  cart-recovery:
    provider: groq
    model: openai/gpt-oss-120b

  subscription-recovery:
    provider: gemini
    model: models/gemini-3.1-flash-lite

  # These two were briefly moved to OpenRouter's free models when their original Gemini
  # buckets hit the daily quota. That was reverted: `nemotron-3-super-120b` and
  # `nemotron-3-ultra-550b` both advertise tool support and both emit a tool call for a
  # trivial one-shot prompt, yet in the actual agent loop they made ZERO tool calls —
  # RTO Shield read the order and never updated it, Dispute Responder did nothing at all.
  #
  # Advertised tool support is not the same as usable tool-calling. Probe with the real
  # prompt, not a ping (risk R3).
  dispute-responder:
    provider: gemini
    model: models/gemini-3.1-flash-lite-preview

  rto-shield:
    provider: gemini
    model: models/gemini-flash-lite-latest

  # Highest request count of all: one call per inbound message.
  personas:
    provider: gemini
    model: models/gemini-3.5-flash-lite

  # Spare buckets kept free for failover.
  spare:
    provider: gemini
    model: models/gemini-2.5-flash-lite

  spare2:
    provider: gemini
    model: models/gemini-flash-lite-latest

  # Failover only. Assume Groq's bucket is shared across its models.
  fallback:
    provider: groq
    model: openai/gpt-oss-20b
