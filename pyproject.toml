[project]
name = "commons"
version = "0.1.0"
description = "An MCP-layer arbitration gateway that enforces policy on the entity being acted upon rather than the agent doing the acting."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2.0.0",
    "openai>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "phonenumbers>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["commons*", "mcp_servers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
